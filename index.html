<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenish World</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  overflow-x:hidden;
}

body{
  font-family:'Poppins',sans-serif;
  background:#000;
}

/* HERO SECTION */
.hero{
  min-height:100vh;
  background:url('hero-main.png') center center/cover no-repeat;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px 20px;
}

.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.70));
}

/* CONTENT */
.content{
  position:relative;
  z-index:2;
  max-width:950px;
  width:100%;
  color:#fff;
}

.welcome{
  font-size:18px;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:0;
  animation:fadeSlide 1.2s ease forwards;
}

h1{
  font-size:68px;
  margin:12px 0 12px;
  line-height:1.08;
  font-weight:700;
  opacity:0;
  transform:translateY(25px);
  animation:riseIn 1.2s ease .4s forwards;
}

.subtitle{
  font-size:20px;
  opacity:0;
  animation:fadeSlide 1.2s ease .9s forwards;
}

h3{
  margin-top:10px;
  font-weight:400;
  font-size:20px;
  opacity:0;
  animation:fadeSlide 1.2s ease 1.1s forwards;
}

/* BUTTONS */
.buttons{
  margin-top:35px;
  display:flex;
  justify-content:center;
  gap:22px;
  flex-wrap:wrap;
  opacity:0;
  animation:fadeSlide 1.2s ease 1.3s forwards;
}

a{
  text-decoration:none;
}

.btn{
  min-width:320px;
  max-width:420px;
  width:100%;
  padding:20px 25px;
  border:none;
  border-radius:18px;
  color:#fff;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:0.3s ease;
  box-shadow:0 14px 35px rgba(0,0,0,.25);
}

.btn::before{
  content:'';
  position:absolute;
  top:0;
  left:-120%;
  width:60%;
  height:100%;
  background:rgba(255,255,255,.22);
  transform:skewX(-25deg);
  transition:left .6s ease;
}

.btn:hover::before{
  left:130%;
}

.btn:hover{
  transform:translateY(-5px);
}

.empire{
  background:linear-gradient(135deg,#0f9d58,#0b6d3f);
}

.foundation{
  background:linear-gradient(135deg,#0a7c8a,#013030);
}

/* FLOATING GLOW */
.glow{
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.12), transparent 60%);
  top:10%;
  left:8%;
  animation:floatGlow 8s ease-in-out infinite;
}

.glow.two{
  top:auto;
  left:auto;
  right:6%;
  bottom:8%;
  animation-delay:2s;
}

/* ANIMATION */
@keyframes riseIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fadeSlide{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes floatGlow{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(30px);
  }
}

/* TABLETS */
@media(max-width:900px){

h1{
  font-size:52px;
}

.btn{
  min-width:280px;
}

}

/* MOBILE */
@media(max-width:768px){

.hero{
  padding:40px 18px;
  min-height:100dvh;
}

.welcome{
  font-size:13px;
  letter-spacing:3px;
}

h1{
  font-size:36px;
  margin:10px 0;
}

.subtitle{
  font-size:15px;
}

h3{
  font-size:16px;
  margin-top:8px;
}

.buttons{
  gap:14px;
  margin-top:28px;
}

.btn{
  min-width:100%;
  font-size:16px;
  padding:16px 18px;
  border-radius:14px;
}

.glow{
  width:260px;
  height:260px;
}

.glow.two{
  width:220px;
  height:220px;
}

}

/* SMALL PHONES */
@media(max-width:430px){

h1{
  font-size:30px;
}

.btn{
  font-size:15px;
  padding:15px;
}

h3{
  font-size:15px;
}

}
</style>
</head>

<body>

<section class="hero">

<div class="glow"></div>
<div class="glow two"></div>

<div class="content">

<div class="welcome">Welcome to</div>

<h1>Greenish World</h1>

<div class="subtitle"></div>

<h3>Explore either of our Amazing brands</h3>

<div class="buttons">

<a href="empire/index.html">
<button class="btn empire">
Greenish World Empire Company Ltd
</button>
</a>

<a href="foundation/index.html">
<button class="btn foundation">
Greenish Rural Empowerment & Health Foundation
</button>
</a>

</div>

</div>
</section>

</body>
</html>
