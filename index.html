<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Greenish World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;overflow:hidden}
.hero{
  min-height:100vh;
  background:url('hero-main.png') center/cover no-repeat;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65));
}
.content{position:relative;z-index:2;max-width:980px;color:#fff}
.welcome{
  font-size:18px;
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:0;
  animation:fadeSlide 1.2s ease forwards;
}
h1{
  font-size:68px;
  margin:10px 0 15px;
  font-weight:700;
  line-height:1.05;
  opacity:0;
  transform:translateY(25px);
  animation:riseIn 1.2s ease .4s forwards;
}
.subtitle{
  font-size:20px;
  opacity:0;
  animation:fadeSlide 1.2s ease .9s forwards;
}
.buttons{
  margin-top:40px;
  display:flex;
  gap:24px;
  justify-content:center;
  flex-wrap:wrap;
  opacity:0;
  animation:fadeSlide 1.2s ease 1.3s forwards;
}
a{text-decoration:none}
.btn{
  min-width:320px;
  padding:20px 28px;
  border:none;
  border-radius:18px;
  color:#fff;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .3s ease, box-shadow .3s ease;
  box-shadow:0 14px 35px rgba(0,0,0,.25);
}
.btn::before{
  content:'';
  position:absolute;
  top:0;left:-120%;
  width:60%;height:100%;
  background:rgba(255,255,255,.22);
  transform:skewX(-25deg);
  transition:left .6s ease;
}
.btn:hover::before{left:130%}
.btn:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.empire{background:linear-gradient(135deg,#0f9d58,#0b6d3f)}
.foundation{background:linear-gradient(135deg,#0a7c8a,#013030)}
.glow{
  position:absolute;
  width:500px;height:500px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.12), transparent 60%);
  top:10%;left:8%;
  animation:floatGlow 8s ease-in-out infinite;
}
.glow.two{top:auto;left:auto;right:6%;bottom:8%;animation-delay:2s}
@keyframes riseIn{to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlide{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatGlow{0%,100%{transform:translateY(0)}50%{transform:translateY(30px)}}
@media(max-width:768px){
  body{overflow:auto}
  h1{font-size:42px}
  .subtitle{font-size:16px}
  .btn{min-width:100%;font-size:17px;padding:18px 20px}
  .buttons{gap:16px}
  .welcome{font-size:14px;letter-spacing:3px}
}
</style>
</head>
<body>
<section class="hero">
<div class="glow"></div>
<div class="glow two"></div>
<div class="content">
<div class="welcome">Welcome to</div>
<h1>Greenish World</h1>
<div class="subtitle"></div>
<div class="buttons">
<a href="empire/index.html"><button class="btn empire">Greenish World Empire</button></a>
<a href="foundation/index.html"><button class="btn foundation">Greenish Rural Empowerment & Health Foundation</button></a>
</div>
</div>
</section>
</body>
</html>
