<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Greenish World</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f7f6;
}

/* TOP BAR */
.top-bar{
  background:#fff;
  border-bottom:1px solid #eee;
  font-size:12px;
}

.top-bar .container{
  max-width:1100px;
  margin:auto;
  padding:6px 20px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

/* STICKY HEADER */
header{
  background:#034d4d;
  color:#fff;
  position:sticky;
  top:0;
  z-index:999;
}

header .container{
  max-width:1100px;
  margin:auto;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{
  margin:0;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:16px;
  font-size:14px;
}

h1{
  text-align:center;
  margin:35px 0 10px;
  color:#034d4d;
}

.sub{
  text-align:center;
  margin-bottom:30px;
  color:#555;
}

/* GALLERY */
.gallery-wrapper{
  max-width:1150px;
  margin:auto;
  padding:20px;
}

.carousel{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.slide{
  display:none;
}

.slide.active{
  display:block;
}

.slide img{
  width:100%;
  height:620px;
  object-fit:cover;
  cursor:pointer;
}

/* BUTTONS */
.nav-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.45);
  color:#fff;
  border:none;
  font-size:28px;
  padding:12px 16px;
  cursor:pointer;
}

.prev{left:10px;}
.next{right:10px;}

.nav-btn:hover{
  background:#034d4d;
}

/* DOTS */
.dots{
  text-align:center;
  margin-top:18px;
  flex-wrap:wrap;
}

.dot{
  width:12px;
  height:12px;
  background:#bbb;
  display:inline-block;
  border-radius:50%;
  margin:5px;
  cursor:pointer;
}

.dot.active{
  background:#034d4d;
}

/* THUMBNAILS */
.thumb-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-top:35px;
}

.thumb-grid img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.thumb-grid img:hover{
  transform:scale(1.03);
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.88);
  z-index:2000;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.modal img{
  max-width:95%;
  max-height:90vh;
  border-radius:12px;
}

.close{
  position:absolute;
  top:15px;
  right:25px;
  color:#fff;
  font-size:40px;
  cursor:pointer;
}

footer{
  background:#222;
  color:#fff;
  text-align:center;
  padding:20px;
  margin-top:40px;
}

/* MOBILE */
@media(max-width:768px){

.top-bar .container,
header .container{
  flex-direction:column;
  text-align:center;
}

nav{
  margin-top:10px;
}

.slide img{
  height:320px;
}

}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
<div class="container">
<span>📞 +234 800 000 0000</span>
<span>✉ info@greenishworld.org</span>
<span>📍 Abuja, Nigeria</span>
</div>
</div>

<div class="container">

<!-- MODAL -->
<div class="modal" id="modal">
<span class="close" onclick="closeModal()">&times;</span>
<img id="modalImg">
</div>

<footer>
<h3>&copy; 2026 Greenish World</h3>
</footer>

<script>
let current = 0;

const slides = document.querySelectorAll('.slide');
const dotsContainer = document.getElementById('dots');

/* CREATE DOTS */
slides.forEach((slide,index)=>{
  const dot = document.createElement('span');
  dot.classList.add('dot');
  if(index===0) dot.classList.add('active');
  dot.onclick = ()=>goToSlide(index);
  dotsContainer.appendChild(dot);
});

const dots = document.querySelectorAll('.dot');

function showSlide(index){
  slides.forEach(s=>s.classList.remove('active'));
  dots.forEach(d=>d.classList.remove('active'));

  slides[index].classList.add('active');
  dots[index].classList.add('active');
}

function changeSlide(step){
  current += step;

  if(current >= slides.length) current = 0;
  if(current < 0) current = slides.length - 1;

  showSlide(current);
}

function goToSlide(index){
  current = index;
  showSlide(current);
}

setInterval(()=>{
  changeSlide(1);
},4000);

/* FULL IMAGE MODAL */
function openModal(src){
  document.getElementById('modal').style.display='flex';
  document.getElementById('modalImg').src = src;
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}
</script>

</html>
